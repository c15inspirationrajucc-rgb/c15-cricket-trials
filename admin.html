<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C15 Admin Dashboard</title><style>body{margin:0;padding:35px;background:#101723;color:#edf0f5;font:15px Arial,sans-serif}main{max-width:1050px;margin:auto}h1{color:#e4b559}input,button{padding:11px;font:inherit}button{background:#e4b559;border:0;font-weight:bold;cursor:pointer}.login{display:flex;gap:10px;flex-wrap:wrap}.stats{font-size:20px;margin:25px 0}table{width:100%;border-collapse:collapse;background:#fff;color:#181818;font-size:13px}th,td{padding:10px;border:1px solid #ddd;text-align:left;vertical-align:top}th{background:#e4b559}#message{color:#f2c96e}</style></head><body><main><h1>C15 Inspiration Cricket Club — Admin Dashboard</h1><p>Yahan aap dekh sakte hain kitne students register hue aur unki payment reference details.</p><div class="login"><input id="password" type="password" placeholder="Admin password"><button id="open">Show registrations</button></div><p id="message"></p><div id="dashboard" hidden><p class="stats">Total registered students: <b id="count"></b></p><table><thead><tr><th>Registration no.</th><th>Name / DOB</th><th>Contact</th><th>Role</th><th>UTR</th><th>Applied on</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const message=document.querySelector('#message'),dashboard=document.querySelector('#dashboard');document.querySelector('#open').onclick=async()=>{message.textContent='Loading…';const r=await fetch('/api/admin/registrations',{headers:{'x-admin-password':document.querySelector('#password').value}});if(!r.ok){message.textContent='Password is incorrect.';return}const list=await r.json();document.querySelector('#count').textContent=list.length;document.querySelector('#rows').innerHTML=list.map(x=>`<tr><td>${x.registrationNumber}</td><td>${x.name}<br>${x.dob}</td><td>${x.phone}<br>${x.email}</td><td>${x.role}<br>${x.battingHand||''} ${x.bowlingHand||''}</td><td>${x.utr}</td><td>${new Date(x.submittedAt).toLocaleString()}</td></tr>`).join('');dashboard.hidden=false;message.textContent='';}</script></body></html>
